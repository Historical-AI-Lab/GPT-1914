[pytest]
# Root test configuration. Before this existed, `pytest` from the repository
# root aborted during collection: deprecated/ holds superseded modules whose
# tests import top-level names that no longer exist, and shubham/ is a frozen
# fork of evalcode whose tests collide with the real ones by module name.
#
# Per-directory pytest.ini files remain for running a single suite in place
# (modelasjudge/, evalcode/tests/, booksample/connectors/, batchconnectors/).
# This file governs a run started from the root.

norecursedirs =
    .git
    __pycache__
    .pytest_cache
    deprecated
    shubham
    qwentuning/qlora-env
    bt_artifacts
    scored_answers
    generated_answers
    booksample/sample1000books
    booksample/averybooks
    booksample/benchmarkbooks
    booksample/edgebooks

markers =
    slow: full statistical sweeps (large R); run explicitly with -m slow
    llm: requires a live LLM call

# Ten directories are named tests/ and each has an __init__.py, so under the
# default "prepend" import mode they all claim the package name `tests` and all
# but the first fail collection. importlib mode gives each module a unique
# internal name; conftest.py at the root then puts the source directories on
# sys.path, which importlib mode does not do by itself.
addopts = --import-mode=importlib

# Two suites additionally share a file basename (connectors/tests and
# batchconnectors/tests both have test_output_format.py). Without this they
# both resolve to `tests.test_output_format`, one shadows the other, and the
# shadowed file's fixtures vanish at setup. Resolving module names through the
# full path instead keeps them distinct.
consider_namespace_packages = true
