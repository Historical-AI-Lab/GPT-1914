[pytest]
# deprecated/ holds superseded modules and their tests. Those tests import
# module names that no longer exist at the top level, so collecting them
# aborted the whole run before anything executed.
norecursedirs = deprecated .git __pycache__ bt_artifacts scored_answers
markers =
    slow: full statistical sweeps (large R); run explicitly with -m slow
    llm: requires a live LLM call
